<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#e6edf3" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <rect x="0" y="0" width="900" height="450" fill="url(#grid)"/>

  <!-- ===================== relationship lines (drawn first, under tables) ===================== -->
  <g stroke="#333" stroke-width="1.4" fill="none">
    <!-- region to sales_reps -->
    <polyline points="220,395 270,395 270,383 320,383"/>
    <!-- sales_reps to accounts -->
    <polyline points="220,343 270,343 270,229 320,229"/>
    <!-- accounts to orders -->
    <polyline points="520,73 570,73 570,139 620,139"/>
    <!-- accounts to web_events -->
    <polyline points="220,129 270,129 270,73 320,73"/>
  </g>

  <!-- crow's foot (many) and one-tick markers -->
  <g stroke="#333" stroke-width="1.4" fill="none">
    <!-- Rel A: many at sales_reps(220,395) opening toward +x, one at region(320,383) tick toward negative x -->
    <path d="M220,389 L232,395 L220,401"/>
    <path d="M306,377 L306,389"/>

    <!-- Rel B: one at sales_reps(220,343) tick toward +x, many at accounts(320,229) opening toward negative x -->
    <path d="M230,337 L230,349"/>
    <path d="M320,223 L310,229 L320,235"/>

    <!-- Rel C: one at accounts(520,73) tick toward +x, many at orders(620,139) opening toward negative x -->
    <path d="M530,67 L530,79"/>
    <path d="M620,133 L610,139 L620,145"/>

    <!-- Rel D: many at web_events(220,129) opening toward +x, one at accounts(320,73) tick toward negative x -->
    <path d="M220,123 L232,129 L220,135"/>
    <path d="M310,67 L310,79"/>
  </g>

  <!-- ===================== web_events ===================== -->
  <g>
    <rect x="30" y="60" width="190" height="134" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <rect x="30" y="60" width="190" height="30" fill="#dfe3e8" stroke="#333" stroke-width="1.4"/>
    <text x="125" y="80" text-anchor="middle" fill="#1f6fb2" font-weight="bold" font-size="15">web_events</text>
    <line x1="64" y1="90" x2="64" y2="194" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="116" x2="220" y2="116" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="142" x2="220" y2="142" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="168" x2="220" y2="168" stroke="#333" stroke-width="1"/>
    <text x="47" y="107" text-anchor="middle" font-weight="bold" font-size="12">PK</text>
    <text x="47" y="133" text-anchor="middle" font-weight="bold" font-size="12">FK</text>
    <text x="76" y="107" font-size="13">id</text>
    <text x="76" y="133" font-size="13">account_id</text>
    <text x="76" y="159" font-size="13">occurred_at</text>
    <text x="76" y="185" font-size="13">channel</text>
  </g>

  <!-- ===================== accounts ===================== -->
  <g>
    <rect x="320" y="30" width="200" height="212" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <rect x="320" y="30" width="200" height="30" fill="#dfe3e8" stroke="#333" stroke-width="1.4"/>
    <text x="420" y="50" text-anchor="middle" fill="#1f6fb2" font-weight="bold" font-size="15">accounts</text>
    <line x1="354" y1="60" x2="354" y2="242" stroke="#333" stroke-width="1"/>
    <line x1="320" y1="86" x2="520" y2="86" stroke="#333" stroke-width="1"/>
    <line x1="320" y1="112" x2="520" y2="112" stroke="#333" stroke-width="1"/>
    <line x1="320" y1="138" x2="520" y2="138" stroke="#333" stroke-width="1"/>
    <line x1="320" y1="164" x2="520" y2="164" stroke="#333" stroke-width="1"/>
    <line x1="320" y1="190" x2="520" y2="190" stroke="#333" stroke-width="1"/>
    <line x1="320" y1="216" x2="520" y2="216" stroke="#333" stroke-width="1"/>
    <text x="337" y="77" text-anchor="middle" font-weight="bold" font-size="12">PK</text>
    <text x="337" y="233" text-anchor="middle" font-weight="bold" font-size="12">FK</text>
    <text x="366" y="77" font-size="13">id</text>
    <text x="366" y="103" font-size="13">name</text>
    <text x="366" y="129" font-size="13">website</text>
    <text x="366" y="155" font-size="13">latitude</text>
    <text x="366" y="181" font-size="13">longitude</text>
    <text x="366" y="207" font-size="13">primary_poc</text>
    <text x="366" y="233" font-size="13">sales_rep_id</text>
  </g>

  <!-- ===================== orders ===================== -->
  <g>
    <rect x="620" y="70" width="220" height="316" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <rect x="620" y="70" width="220" height="30" fill="#dfe3e8" stroke="#333" stroke-width="1.4"/>
    <text x="730" y="90" text-anchor="middle" fill="#1f6fb2" font-weight="bold" font-size="15">orders</text>
    <line x1="654" y1="100" x2="654" y2="386" stroke="#333" stroke-width="1"/>
    <line x1="620" y1="126" x2="840" y2="126" stroke="#333" stroke-width="1"/>
    <line x1="620" y1="152" x2="840" y2="152" stroke="#333" stroke-width="1"/>
    <line x1="620" y1="178" x2="840" y2="178" stroke="#333" stroke-width="1"/>
    <line x1="620" y1="204" x2="840" y2="204" stroke="#333" stroke-width="1"/>
    <line x1="620" y1="230" x2="840" y2="230" stroke="#333" stroke-width="1"/>
    <line x1="620" y1="256" x2="840" y2="256" stroke="#333" stroke-width="1"/>
    <line x1="620" y1="282" x2="840" y2="282" stroke="#333" stroke-width="1"/>
    <line x1="620" y1="308" x2="840" y2="308" stroke="#333" stroke-width="1"/>
    <line x1="620" y1="334" x2="840" y2="334" stroke="#333" stroke-width="1"/>
    <line x1="620" y1="360" x2="840" y2="360" stroke="#333" stroke-width="1"/>
    <text x="637" y="117" text-anchor="middle" font-weight="bold" font-size="12">PK</text>
    <text x="637" y="143" text-anchor="middle" font-weight="bold" font-size="12">FK</text>
    <text x="666" y="117" font-size="13">id</text>
    <text x="666" y="143" font-size="13">account_id</text>
    <text x="666" y="169" font-size="13">occurred_at</text>
    <text x="666" y="195" font-size="13">standard_qty</text>
    <text x="666" y="221" font-size="13">gloss_qty</text>
    <text x="666" y="247" font-size="13">poster_qty</text>
    <text x="666" y="273" font-size="13">total</text>
    <text x="666" y="299" font-size="13">standard_amt_usd</text>
    <text x="666" y="325" font-size="13">gloss_amt_usd</text>
    <text x="666" y="351" font-size="13">poster_amt_usd</text>
    <text x="666" y="377" font-size="13">total_amt_usd</text>
  </g>

  <!-- ===================== sales_reps ===================== -->
  <g>
    <rect x="30" y="300" width="190" height="108" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <rect x="30" y="300" width="190" height="30" fill="#dfe3e8" stroke="#333" stroke-width="1.4"/>
    <text x="125" y="320" text-anchor="middle" fill="#1f6fb2" font-weight="bold" font-size="15">sales_reps</text>
    <line x1="64" y1="330" x2="64" y2="408" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="356" x2="220" y2="356" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="382" x2="220" y2="382" stroke="#333" stroke-width="1"/>
    <text x="47" y="347" text-anchor="middle" font-weight="bold" font-size="12">PK</text>
    <text x="47" y="399" text-anchor="middle" font-weight="bold" font-size="12">FK</text>
    <text x="76" y="347" font-size="13">id</text>
    <text x="76" y="373" font-size="13">name</text>
    <text x="76" y="399" font-size="13">region_id</text>
  </g>

  <!-- ===================== region ===================== -->
  <g>
    <rect x="320" y="340" width="200" height="82" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <rect x="320" y="340" width="200" height="30" fill="#dfe3e8" stroke="#333" stroke-width="1.4"/>
    <text x="420" y="360" text-anchor="middle" fill="#1f6fb2" font-weight="bold" font-size="15">region</text>
    <line x1="354" y1="370" x2="354" y2="422" stroke="#333" stroke-width="1"/>
    <line x1="320" y1="396" x2="520" y2="396" stroke="#333" stroke-width="1"/>
    <text x="337" y="387" text-anchor="middle" font-weight="bold" font-size="12">PK</text>
    <text x="366" y="387" font-size="13">id</text>
    <text x="366" y="413" font-size="13">name</text>
  </g>

  <text x="450" y="440" text-anchor="middle" font-size="11" fill="#666">Parch &amp; Posey database schema</text>
</svg>
